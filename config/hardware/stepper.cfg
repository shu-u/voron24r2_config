#####################################################################
#   B(X) ---------A(Y)
#   |                |
#   |--------E-------|
#   |                |
#   |                |
#   |                |
#####################################################################
##                   X-axis on MOTOR_0(B Motor)
#####################################################################


#####################################################################
##  NOTE on hold_current
#####################################################################
##  All hold_current values below are commented out. Klipper's
##  docs/TMC_Drivers.md states "Prefer to not specify a hold_current",
##  because changing the motor current can itself introduce motor movement
##  (detent forces), i.e. the stepper resumes at a slightly different
##  position than where it stopped. Voron's stock config leaves it unset too.
##
##  Documented exception: printers with dedicated Z motors that are idle
##  during normal printing may run cooler with a hold_current, but that
##  requires tuning driver_TPOWERDOWN / driver_IHOLDDELAY as well. The docs
##  conclude: "If unsure, prefer to not specify a hold_current."
#####################################################################

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: stealthburner:PB8
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 50   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 0.8
#hold_current: 0.7          # see NOTE on hold_current above
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on MOTOR1 (A Motor)
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
position_endstop: 350       # Mechanical reset point coordinates for X-axis (change to 350 for 350 models)
position_max: 350           # X-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 50            # Reset speed maximum 100
homing_retract_dist: 5      # Setback distance after the first trigger of the reset switch
homing_positive_dir: true   # Direction of reset (generally no change required)

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 0.8
#hold_current: 0.7          # see NOTE on hold_current above
sense_resistor: 0.110
stealthchop_threshold: 0

####################################################################################
#   z1 -------------- z2
#   |                 |
#   |                 |
#   |                 |
#   |                 |
#  z0---   display ---z3
####################################################################################

## Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
#endstop_pin: PG10 # for z endstop switch
endstop_pin: probe:z_virtual_endstop # for cartographer as a virtual z endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
homing_retract_dist: 0 #3 # cartographer needs this to be set to 0
#position_endstop: 5 # cartographer needs this to be commented out
position_max: 336
position_min: -10
homing_speed: 8
second_homing_speed: 3

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
#hold_current: 0.8          # see NOTE on hold_current above
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left on MOTOR3
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
#hold_current: 0.8          # see NOTE on hold_current above
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
#hold_current: 0.80         # see NOTE on hold_current above
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
#hold_current: 0.80         # see NOTE on hold_current above
sense_resistor: 0.110
stealthchop_threshold: 0
