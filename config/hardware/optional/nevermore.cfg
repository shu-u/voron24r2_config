#####################################################################
# 	Nevermore controller + chamber sensor  (NOT YET ENABLED)
#####################################################################
# Hardware is still being built. This file is intentionally not included by
# config/hardware.cfg - enable it by hand once the sensor is mounted.
#
# THREE BUGS TO FIX BEFORE ENABLING:
#   1. serial: needs the full device path, not just the by-id name, or the
#      MCU will never connect. Fixed below.
#   2. restart_methoda -> restart_method (typo). Fixed below.
#   3. QUERY_CHAMBER below reads sensor.gas_level, which does not exist on a
#      BME280 (temp / pressure / humidity only) - gas_level is a BME680
#      feature. That line raises a Jinja error. Fixed below.
#
# Sensor placement matters more than the config: do NOT mount it inside the
# Nevermore. See NOTES.md section 1.3 for where to put it and why, plus the
# I2C cable-length constraint and the simpler NTC-on-the-Octopus alternative.
#####################################################################

[mcu nevermore_sensor]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C74034C7C23-if00
restart_method: rpi_usb

[temperature_sensor chamber]
sensor_type: BME280
i2c_mcu: nevermore_sensor
i2c_bus: i2c.1   # optional
i2c_address: 119 # optional

[gcode_macro QUERY_CHAMBER]
gcode:
    {% set sensor = printer["bme280 chamber"] %}
    {action_respond_info(
        "Temperature: %.2f C\n"
        "Pressure: %.2f hPa\n"
        "Humidity: %.2f%%" % (
            sensor.temperature,
            sensor.pressure,
            sensor.humidity))}
##   "Gas Level: %.2f VOC" / sensor.gas_level was removed here: gas_level is
##   a BME680 reading. A BME280 only exposes temperature, pressure and
##   humidity, so reading it raised a Jinja error.
