# Registers the toolhead/ subdirectory, mirroring the pattern used by
# config/hardware.cfg, config/software.cfg and config/macro.cfg.
#
# NOTE: this line used to read './toolheadd/*.cfg' (typo). Klipper allows a
# wildcard [include] to match zero files without error, so it silently did
# nothing - the directory was only loaded because hardware.cfg listed it too.
[include ./toolhead/*.cfg]
