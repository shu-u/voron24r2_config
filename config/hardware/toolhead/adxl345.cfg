#####################################################################
# 	Accelerometer - ADXL345 on the EBB36
#####################################################################

[adxl345]
cs_pin: stealthburner:PB12
spi_software_sclk_pin: stealthburner:PB10
spi_software_mosi_pin: stealthburner:PB11
spi_software_miso_pin: stealthburner:PB2
axes_map: x,y,z
##  VERIFY THIS VALUE. The EBB36 is mounted vertically on the
##  Stealthburner, so the chip's axes do not necessarily line up with the
##  printer's. Run ACCELEROMETER_QUERY with the printer idle: gravity
##  (~9800 mm/s^2) must appear on the *z* component, with x and y near
##  zero. If it shows up elsewhere, remap accordingly, e.g.
##      gravity on y  ->  axes_map: x,z,-y   (or x,-z,y)
##      gravity on x  ->  axes_map: z,y,-x   (or -z,y,x)
##  A wrong map silently swaps the X and Y resonance results.

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 50
##  Bed centre at mid-gantry height for a 350 build. Without this section
##  TEST_RESONANCES / SHAPER_CALIBRATE do not exist as commands, which is
##  why input shaping was never re-measured after the move to CAN.
