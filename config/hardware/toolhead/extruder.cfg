#####################################################################
# 	Extruder
#####################################################################

#	E0 on MOTOR6
[extruder]
step_pin: stealthburner: PD0
dir_pin: stealthburner: PD1
enable_pin: !stealthburner: PD2
##	Update value below when you perform extruder calibration
##	If you ask for 100mm of filament, but in reality it is 98mm:
##	rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  Orbiter V2.5. The gear_ratio below is a leftover from the stock Voron
##  BMG/Clockwork config - Orbiter folds its own reduction into
##  rotation_distance, so the ratio must not be applied twice.
##  Effective value is unchanged: 13.753296 * 17 / 50 = 4.676121
rotation_distance: 4.676121     #Orbiter V2.5, calibrated
#gear_ratio: 50:17              #BMG Gear Ratio - not used by Orbiter
microsteps: 16
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: stealthburner: PB13
##	Validate the following thermistor type to make sure it is correct
sensor_type: ATC Semitec 104GT-2
sensor_pin: stealthburner: PA3
min_temp: 0                     # 10 shuts Klipper down if the room is colder than 10C
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##	Try to keep pressure_advance below 1.0
pressure_advance: 0.03
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 101

# sensor_type:MAX31865
# sensor_pin: stealthburner: PA4
# spi_bus: spi1
# rtd_nominal_r: 100
# rtd_reference_r: 430
# rtd_num_of_wires: 2

##	E0 on MOTOR6
##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: stealthburner: PA15
interpolate: false
run_current: 0.5
##  Orbiter V2.5's motor is rated higher than this; if you see skipped steps
##  on fast retractions, raise run_current toward 0.65-0.85 per Orbiter's docs.
#hold_current: 0.4          # see NOTE on hold_current in hardware/stepper.cfg
sense_resistor: 0.110
stealthchop_threshold: 0

[verify_heater extruder]
check_gain_time: 90