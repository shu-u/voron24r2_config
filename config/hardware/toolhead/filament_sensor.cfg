#####################################################################
# 	Filament Sensor - Orbiter Smart Sensor  (PLACEHOLDER)
#####################################################################
# STATUS: sensor is physically installed, wiring pin not decided yet.
#
# This section is intentionally commented out. A
# [filament_switch_sensor] / [filament_motion_sensor] section without
# switch_pin makes Klipper refuse to start entirely, so an "empty"
# placeholder is not safe. Uncomment the whole block once wired.
#
#--------------------------------------------------------------------
# 1) SENSOR TYPE
#--------------------------------------------------------------------
# The Orbiter Smart Sensor is a MOTION sensor: a magnet on a wheel plus a
# hall sensor, so it emits pulses while filament moves. It cannot report
# "filament present" while nothing is being extruded.
# => use [filament_motion_sensor], not [filament_switch_sensor]. Klipper
#    counts extruded filament and flags a runout when no pulse arrives
#    within detection_length mm of extrusion.
#
# Verify on the real machine before building the LOAD/UNLOAD flow:
#   QUERY_FILAMENT_SENSOR SENSOR=orbiter_smart_sensor
#   - extrude 20mm with filament loaded  -> detected: True
#   - extrude 20mm with filament removed -> detected: False
#   - pull the filament out by hand, extrude nothing -> state does NOT change
# That last line is why "poll until the sensor reports no filament" cannot
# work as an unload completion check.
#
#--------------------------------------------------------------------
# 2) PIN CHOICE ON THE EBB36  --  do NOT just pick any free pad
#--------------------------------------------------------------------
# Hard constraints:
#   - must be a plain 3.3V GPIO usable as an input
#   - must NOT be a MOSFET output: PA0 / PA1 (fans), PB13 (hotend heater)
#   - must NOT be an ADC pad: PA3 (hotend thermistor)
#   - must not already be in use: PB8 (X endstop, see hardware/stepper.cfg),
#     PB12 / PB10 / PB11 / PB2 (ADXL345 SPI), PD3 (Stealthburner neopixel),
#     PD0 / PD1 / PD2 / PA15 (extruder stepper + TMC UART)
#   - needs the internal pull-up, i.e. prefix with '^'
#
# BTT's own EBB36/EBB42 v1.2 sample config documents PB3 and PB4 as the
# filament-sensor pins (PB4 = switch, PB3 = motion). Neither is used by
# this build, so PB3 is the recommended choice.
#
# Wiring: the sensor needs 5V / GND / SIG. Take 5V and GND from a spare
# EBB36 endstop or FS header. If you are unsure whether your unit drives
# SIG push-pull at 5V rather than pulling it to ground, measure SIG with a
# multimeter before connecting it - the EBB36 GPIOs are 3.3V.
#
#--------------------------------------------------------------------
# 3) THE BLOCK ITSELF
#--------------------------------------------------------------------
#[filament_motion_sensor orbiter_smart_sensor]
#switch_pin: ^stealthburner:PB3
#detection_length: 7.0
##   Filament that must be extruded without a pulse before a runout is
##   declared. Raise it if you get false runouts (soft/flexible filament,
##   many tiny retractions); lower it for faster detection.
#extruder: extruder
#pause_on_runout: True
#event_delay: 3.0
#runout_gcode:
#insert_gcode:
#
# After enabling it, also uncomment variable_runout_sensor in
# config/macro/client_variable.cfg so RESUME refuses to restart a print
# with no filament loaded.
