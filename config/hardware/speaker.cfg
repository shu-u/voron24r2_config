#####################################################################
# 	Audio hardware
#####################################################################

# Enable / unmute line for the external audio amplifier. The wav playback
# itself happens on the Pi via aplay - see config/macro/audio.cfg.
# PE5 is the FAN1 header on the Octopus and is not used by anything else.
[output_pin speaker]
pin: PE5
pwm: false
value: 1
shutdown_value: 0
##   Mute the amp if the MCU shuts down, so a fault cannot leave it driven.

# Piezo beeper on the mini12864 (EXP1_1 = PE8, unused by the display
# itself). PWM is required to produce a tone: cycle_time sets the pitch and
# the duty cycle sets the volume. Driven by M300 / BEEP in
# config/macro/helper/notify.cfg.
[output_pin beeper]
pin: EXP1_1
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
