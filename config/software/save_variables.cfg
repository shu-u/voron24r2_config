#####################################################################
# 	Persistent variables
#####################################################################
# Unlike SET_GCODE_VARIABLE, values stored here survive a Klipper restart or
# a power cycle.
#
#   SAVE_VARIABLE VARIABLE=filament_loaded VALUE=True
#   {printer.save_variables.variables.filament_loaded}
#
# Needed for the Orbiter Smart Sensor / Blobifier / FilaMatrix flow: the
# Orbiter sensor is a motion sensor and cannot report whether filament is
# statically present (see NOTES.md 1.1), so "is filament loaded", which
# material, and the cutter blade's cut count all have to be remembered in
# software - and that memory is useless if it does not survive a restart.
#
# Notes:
#   - Variable names must be lowercase.
#   - The whole file is rewritten on every SAVE_VARIABLE call, so do not call
#     it inside a tight loop.
#   - Klipper creates the file automatically if it is missing, but if the
#     file ever contains invalid content Klipper raises "Unable to parse
#     existing variable file" and refuses to start. If that happens, delete
#     variables.cfg and restart.
#   - variables.cfg is runtime state, not configuration - it is listed in
#     .gitignore. It also sits at the config root, so ./config/*.cfg does not
#     pick it up as a config file.

[save_variables]
filename: ~/printer_data/config/variables.cfg
