#####################################################################
# 	G2 / G3 arc move support
#####################################################################
# Pure host-side feature: klippy/extras/gcode_arcs.py decomposes an arc into
# short G1 segments and hands them to gcode_move. There is no MCU interaction
# and no hardware requirement - this is not the Marlin situation where
# ARC_SUPPORT is a compile-time flag constrained by controller flash/CPU.
# It is opt-in only because Klipper does not register optional G-code
# commands unless they are configured (same as G10/G11 needing
# [firmware_retraction]).
#
# Registers: G2, G3 (arcs) and G17 / G18 / G19 (plane select).
#
# WHY IT MATTERS: without this section, a G2/G3 in a sliced file is reported
# as "Unknown command", which is NOT fatal - the arc is simply never
# executed. The toolhead travels straight to the next explicit coordinate,
# so the geometry is wrong and the extrusion amount is off, with nothing but
# a console line to indicate it. Enabling this turns a silent failure into
# correct motion.
#
# BEHAVIOUR CHANGE TO BE AWARE OF: with this section active, malformed arcs
# now raise a real error and abort the print instead of being skipped:
#   - the radius form 'G2 X.. Y.. R..'  -> "G2/G3 does not support R moves"
#   - an arc with no offsets            -> "G2/G3 requires IJ, IK or JK
#                                           parameters"
# Only the I/J/K offset form is supported. PrusaSlicer's and OrcaSlicer's arc
# fitting both emit the I/J form, so this is not a problem in practice, but
# hand-written or CNC-flavoured gcode may use R.

[gcode_arcs]
resolution: 0.2
##   Chord length in mm used to approximate the arc. Klipper's default is 1.0.
##   Chord error is roughly c^2/(8*R), so even 1.0mm is only 0.025mm off on a
##   5mm radius - invisible. The reason to go finer is motion, not accuracy:
##   every segment junction is a corner, and a smaller direction change per
##   junction lets Klipper's junction deviation carry more speed through the
##   arc. 0.2mm is a good balance; going much below that mainly inflates the
##   move queue.
