#####################################################################
# 	Cancel individual objects mid-print
#####################################################################
# Lets Mainsail cancel one object out of a plate instead of aborting the
# whole print - worth having on a 350mm bed where many parts share a plate.
#
# REQUIRES A MOONRAKER CHANGE AS WELL:
#   [file_manager]
#   enable_object_processing: True
# Moonraker then scans each uploaded gcode file and injects the
# EXCLUDE_OBJECT_DEFINE / EXCLUDE_OBJECT_START / EXCLUDE_OBJECT_END markers
# this section consumes. Alternatively the slicer can emit them directly
# (OrcaSlicer / PrusaSlicer "label objects", Klipper flavour).
#
# Cost: the upload scan adds a few seconds per file on a Pi 4 for large
# gcode. That is the only downside.
#
# Note: only files uploaded AFTER enabling object processing get the markers.
# Existing files in the queue will not have them.

[exclude_object]
