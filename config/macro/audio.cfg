#####################################################################
# 	Registering gcode_shell_command with Moonraker's update_manager
#####################################################################
# Not currently in moonraker.conf. Without it, a Klipper update can leave
# klippy/extras/gcode_shell_command.py behind and the printer will not
# start. If KIAUH placed the repo at ~/klipper_shell_command (check with
# 'ls ~ | grep -i shell'), add this to moonraker.conf:
#
#   [update_manager gcode_shell_command]
#   type: git_repo
#   path: ~/klipper_shell_command
#   origin: https://github.com/dw-0/kiauh.git
#   primary_branch: master
#   managed_services: klipper
#   is_system_service: False
#
# KIAUH normally copies the file rather than cloning a repo, in which case
# there is nothing for update_manager to track - just re-run
# 'kiauh -> Advanced -> G-Code Shell Command' after any Klipper update.
