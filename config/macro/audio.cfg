#####################################################################
# 	Voice / sound notifications
#####################################################################
# STATUS: work in progress - the wav files exist but nothing calls them yet.
#
# Requires the gcode_shell_command Klipper extra (installed via KIAUH ->
# "G-Code Shell Command"). It is NOT part of stock Klipper: if
# klippy/extras/gcode_shell_command.py is missing, Klipper will refuse to
# start with "Unknown config object 'gcode_shell_command'". See the
# update_manager note at the bottom of this file.

# share variables between macros
# can be accessed via {printer["gcode_macro _VOICE_PROFILE"].VARIABLE_NAME}
# can be set with SET_GCODE_VARIABLE MACRO=_VOICE_PROFILE VARIABLE=VARIABLE_NAME VALUE=NEW_VALUE
[gcode_macro _VOICE_PROFILE]
variable_base_path: "/home/pi/printer_data/config/audio/"
##   Must end with a trailing slash. Check the Linux user name here - it is
##   only 'pi' on an image that was set up that way; on a fresh Raspberry Pi
##   OS install it is whatever you chose during setup.
variable_profile: "ivy/"
##   Subdirectory of base_path, also with a trailing slash.
gcode:


[gcode_shell_command _PLAY_AUDIO]
command: /bin/sh /home/pi/printer_data/config/audio/play.sh
##   Deliberately NOT 'aplay' directly. RUN_SHELL_COMMAND waits for the child
##   process to exit and kills it once 'timeout' expires (default 2s), so
##   calling aplay here truncated any clip longer than 2s *and* stalled the
##   printer's command queue for the length of the clip. play.sh backgrounds
##   aplay and returns immediately. gcode_shell_command does not use a shell,
##   so the '&' has to live inside a script.
timeout: 2.0
verbose: True
##   The wrapper is silent on success and only prints when the file is
##   missing, so verbose is useful rather than noisy.


[gcode_macro _PLAY_FILE]
description: Play audio file
gcode:
    {% set file = params.FILE|default("")|string %}
    {% set base_path = printer["gcode_macro _VOICE_PROFILE"].base_path %}
    {% set profile = printer["gcode_macro _VOICE_PROFILE"].profile %}

    {% if file == "" %}
        { action_respond_info("_PLAY_FILE: FILE parameter is required.") }
    {% else %}
        RUN_SHELL_COMMAND CMD=_PLAY_AUDIO PARAMS={base_path}{profile}{file}
    {% endif %}


[gcode_macro SWITCH_VOICE_PROFILE]
description: Switch voice profile
gcode:
    {% set _profile = params.PROFILE|default("ivy")|string %}
    ##  SET_GCODE_VARIABLE parses VALUE with ast.literal_eval, so a string
    ##  value has to arrive already quoted. The previous map had 'ivy' mapped
    ##  to '"ivy"' (quoted but missing the trailing slash, producing paths
    ##  like .../audioivyprint_start.wav) and 'whitecul' mapped to
    ##  'whitecul/' (unquoted, which failed with "Unable to parse ... as a
    ##  literal"). Every entry needs both the quotes and the slash.
    {% set profile_map = {'ivy': '"ivy/"', 'whitecul': '"whitecul/"'} %}

    {% if _profile not in profile_map %}
        { action_raise_error("Unknown voice profile '%s'. Known: %s"
            % (_profile, profile_map.keys()|join(', '))) }
    {% else %}
        {% set new = profile_map[_profile] %}
        SET_GCODE_VARIABLE MACRO=_VOICE_PROFILE VARIABLE=profile VALUE={new}
        { action_respond_info("Voice profile set to '%s'." % _profile) }
    {% endif %}


[gcode_macro _PLAY_SAMPLE]
description: Play sample audio file
gcode:
    ##  sample.wav sits in base_path itself, not inside a profile directory.
    RUN_SHELL_COMMAND CMD=_PLAY_AUDIO PARAMS={printer["gcode_macro _VOICE_PROFILE"].base_path}sample.wav


