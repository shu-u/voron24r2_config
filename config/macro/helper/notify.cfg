#####################################################################
# 	Notification helpers - beeper and status line
#####################################################################
# BEEP / SLEEP / CLEAR_SCREEN / SCHEDULE_CLEAR_SCREEN were being called
# from PURGE_NOZZLE, LOAD_FILAMENT, UNLOAD_FILAMENT and CHANGE_FILAMENT but
# were never defined anywhere. BEEP and friends only logged
# 'Unknown command', but UPDATE_DELAYED_GCODE with an unregistered ID is a
# hard error - so LOAD_FILAMENT and UNLOAD_FILAMENT always aborted there,
# before RESTORE_GCODE_STATE ran.
#
# Beeper hardware: [output_pin beeper] in config/hardware/speaker.cfg.

[gcode_macro M300]
description: Play a tone. S = frequency in Hz, P = duration in ms
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    {% if S > 0 %}
        SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0 / S }
    {% endif %}
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro BEEP]
description: Beep R times. TONE = Hz, DURATION = ms, DELAY = ms between beeps
gcode:
    {% set tone     = params.TONE|default(1800)|int %}
    {% set duration = params.DURATION|default(100)|int %}
    {% set delay    = params.DELAY|default(200)|int %}
    ; accepts both R= and REPETITIONS=, since both spellings were in use
    {% set count    = params.R|default(params.REPETITIONS|default(1))|int %}
    {% for _ in range(count) %}
        M300 S{tone} P{duration}
        {% if not loop.last %}
            G4 P{delay}
        {% endif %}
    {% endfor %}

[gcode_macro SLEEP]
description: Dwell for MS milliseconds
gcode:
    G4 P{params.MS|default(100)|int}

[gcode_macro CLEAR_SCREEN]
description: Clear the M117 status message
gcode:
    M117

[delayed_gcode SCHEDULE_CLEAR_SCREEN]
gcode:
    CLEAR_SCREEN
