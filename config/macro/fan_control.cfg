[delayed_gcode _NEVERMORE_OFF]
initial_duration: 0
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0
    { action_respond_info("Turned off Nevermore fan via timer.") }


[delayed_gcode _EXHAUST_FAN_OFF]
initial_duration: 0
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    { action_respond_info("Turned off exhaust fan via timer.") }


[gcode_macro RUN_FAN_TIMER]
description: "Spins a fan and schedules it to turn off. Non-blocking."
gcode:
    {% set fan = params.FAN|default("none")|string %}
    {% set duration = params.DURATION|default(10)|int %}
    {% set speed = params.SPEED|default(100)|int %}
    
    # --- Map fan names to their delayed_gcode handlers ---
    {% set fan_map = {'nevermore': '_NEVERMORE_OFF', 'exhaust_fan': '_EXHAUST_FAN_OFF'} %}

    {% if fan not in fan_map %}
        { action_raise_error("Fan '%s' is not configured for timed operation." % fan) }
    {% else %}
        {% set speed_float = speed / 100.0 %}
        {% set handler_id = fan_map[fan] %}

        { action_respond_info("Activating fan '%s' at %d%% for %d seconds." % (fan, speed, duration)) }
        
        # 1. Turn the fan ON
        SET_FAN_SPEED FAN={fan} SPEED={speed_float}
        
        # 2. Schedule the corresponding handler to run after DURATION seconds
        UPDATE_DELAYED_GCODE ID={handler_id} DURATION={duration}
    {% endif %}


[gcode_macro STOP_FAN_TIMER]
description: "Stop a timed fan now and cancel any pending off-timer."
gcode:
    {% set fan = params.FAN|default("none")|string %}
    {% set fan_map = {'nevermore': '_NEVERMORE_OFF', 'exhaust_fan': '_EXHAUST_FAN_OFF'} %}

    {% if fan not in fan_map %}
        { action_raise_error("Fan '%s' is not configured for timed operation." % fan) }
    {% else %}
        SET_FAN_SPEED FAN={fan} SPEED=0
        # DURATION=0 cancels a scheduled delayed_gcode
        UPDATE_DELAYED_GCODE ID={fan_map[fan]} DURATION=0
    {% endif %}


[gcode_macro _ON_PRINT_CANCEL]
description: "Helper: run by CANCEL_PRINT via _CLIENT_VARIABLE.user_cancel_macro"
gcode:
    # Nevermore speed is set by the slicer during a print, so nothing used to
    # turn it off when a print was cancelled - it just ran forever. A cancelled
    # print leaves the same fumes in the chamber as a finished one, so run the
    # same post-print purge as PRINT_END rather than stopping dead.
    RUN_FAN_TIMER FAN=nevermore DURATION=300 SPEED=100
    RUN_FAN_TIMER FAN=exhaust_fan DURATION=300 SPEED=100