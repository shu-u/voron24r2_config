#####################################################################
# 	Mainsail / Fluidd client macro configuration
#####################################################################
# PAUSE, RESUME, CANCEL_PRINT and _TOOLHEAD_PARK_PAUSE_CANCEL all live in
# mainsail.cfg. They are configured through the variables below - they are
# NOT meant to be redefined.
#
# Why this file exists: config/macro/override/{pause,resume,cancel_print}.cfg
# and config/macro/helper/toolhead_peak_pause_cancel.cfg used to redeclare
# those same sections. Klipper parses its config with
# RawConfigParser(strict=False), so duplicate sections are silently merged
# instead of erroring, and printer.cfg includes ./config/*.cfg *after*
# mainsail.cfg - so the local copies won and quietly disabled:
#   - nozzle temperature restore on RESUME (a pause longer than
#     idle_timeout left the hotend cold and the print resumed anyway)
#   - idle_timeout extension while paused (motors dropped after 30 min)
#   - the runout-aware RESUME guard
#   - M106 S0 and SET_PAUSE_NEXT_LAYER ENABLE=0 on CANCEL_PRINT
#   - the X / Y / Z_MIN park parameters (the local PAUSE ignored them)
# Those four files are gone; use the variables here instead.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos:    True    # honour custom_park_x / custom_park_y
variable_custom_park_x:     50.0    # PAUSE park position
variable_custom_park_y:     5.0
variable_custom_park_dz:    10.0    # z-hop above the print. The old override
                                    # used 2.0, which parks a hot nozzle just
                                    # above the part and leaves a heat mark.
variable_retract:           1.0     # mm retracted on PAUSE
variable_speed_retract:     35.0    # mm/s
variable_unretract:         1.0     # mm pushed back on RESUME
variable_speed_unretract:   35.0    # mm/s
variable_speed_hop:         15.0    # z-hop speed, mm/s
variable_speed_move:        200.0   # park travel speed, mm/s
variable_park_at_cancel:    True    # also park on CANCEL_PRINT
variable_park_at_cancel_x:  50.0
variable_park_at_cancel_y:  5.0
variable_cancel_retract:    5.0     # mm retracted on CANCEL_PRINT
variable_idle_timeout:      43200   # 12h while paused, restored on resume.
                                    # [idle_timeout] itself stays at 1800s.
variable_user_cancel_macro: "_ON_PRINT_CANCEL"
#variable_runout_sensor:    "filament_motion_sensor orbiter_smart_sensor"
##   Keep this commented until the sensor is actually enabled in
##   hardware/toolhead/filament_sensor.cfg. RESUME evaluates
##   printer[runout_sensor].filament_detected, which raises a Jinja error
##   if the object does not exist.
gcode:
