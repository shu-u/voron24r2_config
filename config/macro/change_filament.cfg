[gcode_macro CHANGE_FILAMENT]
gcode:
    {% set BEEP = params.BEEP|default(2)|int %} ; Number of beeps to alert user
    {% set X = params.X|default(50)|float %} ; X position for filament change
    {% set Y = params.Y|default(5)|float %} ; Y position for filament change
    {% set Z = params.Z|default(10)|float %} ; minimum absolute Z for the park move

    ; Mainsail's PAUSE forwards rawparams to _TOOLHEAD_PARK_PAUSE_CANCEL,
    ; which accepts X / Y / Z_MIN. (The old local PAUSE override ignored
    ; these entirely and always parked at max-5, max-5.)
    PAUSE X={X} Y={Y} Z_MIN={Z}
    UNLOAD_FILAMENT
    BEEP R={BEEP}