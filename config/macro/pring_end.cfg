[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    ; The stock Voron ending does this relative (G91 / G0 Z1 X20 Y20), which
    ; throws "Move out of range" whenever a print finishes within 20mm of
    ; X/Y max - and then TURN_OFF_HEATERS and the fan timers below never
    ; run. Clamp the wipe move to the build volume instead.
    {% set act    = printer.gcode_move.gcode_position %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set max    = printer.toolhead.axis_maximum %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set x_safe = [act.x + 20.0, max.x - origin.x - 5.0]|min %}
        {% set y_safe = [act.y + 20.0, max.y - origin.y - 5.0]|min %}
        {% set z_wipe = [act.z + 1.0,  max.z - origin.z - 5.0]|min %}
        {% set z_park = [act.z + 3.0,  max.z - origin.z - 5.0]|min %}
        G90                            ; absolute positioning
        G1 X{x_safe} Y{y_safe} Z{z_wipe} F20000  ; move nozzle to remove stringing
        TURN_OFF_HEATERS
        M107                           ; turn off fan
        G1 Z{z_park} F3000             ; move nozzle up
        G1 X10 Y340 F3600              ; park nozzle at rear
    {% else %}
        TURN_OFF_HEATERS
        M107                           ; turn off fan
    {% endif %}
    BED_MESH_CLEAR
    RUN_FAN_TIMER FAN=nevermore DURATION=300 SPEED=100
    RUN_FAN_TIMER FAN=exhaust_fan DURATION=300 SPEED=100


## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
