[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
# Reference(cartographer): https://docs.cartographer3d.com/cartographer-probe/installation-and-setup/installation/print-start-macro
gcode:
    {% set BED_TEMP = params.BED|default(100)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(255)|float %}
    {% set CARTOGRAPHER_CALIBRATE_TEMP = 150|float %} # nozzle temp used for probing

    # Clear any live-Z / baby-stepping offset left over from the previous
    # print. Without this a SET_GCODE_OFFSET made mid-print silently carries
    # into every following print. A permanent nozzle offset belongs on the
    # Cartographer side, not in a leftover gcode offset.
    SET_GCODE_OFFSET Z=0

    M140 S{BED_TEMP}                     # ベッド温度セット
    M104 S{CARTOGRAPHER_CALIBRATE_TEMP}  # Set extruder to the cartographer probing temperature
    M190 S{BED_TEMP}                     # ベッド1stレイヤ温度到達待機

    G32                                  # Homing all axes and Gantry levelling
    G90                                  # Specify absolute coordinate
    G92 E0                               # Reset Extruder
    BED_MESH_CALIBRATE

    # TODO(Blobifier): BRUSH-ONLY WIPE GOES HERE, immediately before the
    # touch. Touch mode measures Z with the nozzle tip itself, so any ooze
    # from the previous print - or accumulated while the nozzle sat at
    # CARTOGRAPHER_CALIBRATE_TEMP during the bed heat-up - offsets Z
    # directly. Do NOT purge at this point: the nozzle is only at 150C.
    CARTOGRAPHER_TOUCH                   # Perform touch probe

    M109 S{EXTRUDER_TEMP}                # Set and wait for the print temperature

    # TODO(Blobifier): PURGE + WIPE GOES HERE, replacing the manual purge
    # line below. This is the first point where the nozzle is at print
    # temperature. Delete the whole "draw purge line" block when the
    # Blobifier takes over - that also resolves the current problem of the
    # purge line sitting at X10.1, outside the bed mesh area (mesh_min is
    # 30,5), where Z compensation is extrapolated.

    # draw purge line
    M82                                 # absolute extrusion: the E values below
                                        # are cumulative. If the slicer's start
                                        # gcode left M83 active they would purge
                                        # 17+32=49mm instead of 32mm.
    G92 E0
    G1 Z20 F3000                        # Move Z Axis up
    G1 X10.1 Y20 Z0.28 F5000.0          # Move to start position
    G1 X10.1 Y200.0 Z0.28 F1500.0 E17   # Draw the first line
    G1 X10.4 Y200.0 Z0.28 F5000.0       # Move to side a little
    G1 X10.4 Y20 Z0.28 F1500.0 E32      # Draw the second line

    G92 E0                           # Reset Extruder
    G90                              # Make sure to set absolute coordinates