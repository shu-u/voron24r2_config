# This just makes Klipper resume immediately after reaching temp. Otherwise it waits for the temperature to stabilize.
# Reference: https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/replace_m109_m190_with_temp_wait.html

[gcode_macro M109]
rename_existing: M99109
description: Uses TEMPERATURE_WAIT instead of M109 to avoid waiting for temperature to stabilize
gcode:
    #Parameters
    ##  'params.S|float' raised a Jinja error when M109 was called without S.
    ##  A bare M109 would also have fallen through to 'M104' with no argument,
    ##  which Klipper reads as S0 and would switch the heater off.
    {% if 'S' not in params %}
        { action_respond_info("M109 called without an S parameter - ignored.") }
    {% else %}
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}
    {% endif %}