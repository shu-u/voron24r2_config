# This just makes Klipper resume immediately after reaching temp. Otherwise it waits for the temperature to stabilize.
# Reference: https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/replace_m109_m190_with_temp_wait.html

[gcode_macro M190]
rename_existing: M99190
description: Uses TEMPERATURE_WAIT instead of M190 to avoid waiting for temperature to stabilize
gcode:
    #Parameters
    ##  'params.S|float' raised a Jinja error when M190 was called without S.
    ##  A bare M190 would also have fallen through to 'M140' with no argument,
    ##  which Klipper reads as S0 and would switch the heater off.
    {% if 'S' not in params %}
        { action_respond_info("M190 called without an S parameter - ignored.") }
    {% else %}
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}
    {% endif %}