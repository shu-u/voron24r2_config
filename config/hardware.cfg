[include ./hardware/*.cfg]
#   ./hardware/toolhead/*.cfg is registered by ./hardware/toolhead.cfg
#
#   ./hardware/optional/ is deliberately NOT auto-included: those files
#   describe hardware that is not always present, and probe.cfg in
#   particular would collide with the Cartographer (both provide the
#   'probe' object). Enable individual files by hand when needed.
